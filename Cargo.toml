[package]
name = "sootmark-usn"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "NTFS USN change journal ($UsnJrnl:$J): every V2, V3 and V4 record, read straight through sparse zeros and damage, with reasons, references and names."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/usn"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "incident-response", "ntfs", "usn"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "usn"

[features]
# PathBuilder::seed_from_mft, with Yamato Security's ys-mft-parser.
mft = ["dep:mft"]

[dependencies]
mft = { git = "https://github.com/Yamato-Security/ys-mft-parser", rev = "9ccde49d1ac252e64fa44af86adde6695989531a", default-features = false, optional = true }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
